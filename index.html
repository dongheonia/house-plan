<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주택 설계"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>주택 설계</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E3EAE9; --page:#F6F8F7; --panel:#FFFFFF; --ink:#1D2524; --muted:#5E6B69; --line:#D3DAD8;
  --land:#FBFCFB; --border-muni:#9AA7A4; --border-prov:#27302F;
  --red:#D8433B; --blue:#2F6BD8; --green:#2C9A57; --focus:#2F6BD8;
  --label:#2A3332; --label-halo:rgba(251,252,251,.85);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#182020; --page:#141918; --panel:#1C2322; --ink:#E7ECEB; --muted:#96A3A0; --line:#2E3836;
  --land:#232B2A; --border-muni:#4F5D5A; --border-prov:#C9D3D1;
  --red:#E5574E; --blue:#4D86EC; --green:#3DB06A; --focus:#7BA6F2;
  --label:#DCE3E1; --label-halo:rgba(35,43,42,.85);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#182020; --page:#141918; --panel:#1C2322; --ink:#E7ECEB; --muted:#96A3A0; --line:#2E3836;
  --land:#232B2A; --border-muni:#4F5D5A; --border-prov:#C9D3D1;
  --red:#E5574E; --blue:#4D86EC; --green:#3DB06A; --focus:#7BA6F2;
  --label:#DCE3E1; --label-halo:rgba(35,43,42,.85);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
.layout{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);flex:1;min-height:0}
/* 위쪽 막대로 메모·위치(지도)·프리폼·설계도·3D 중 하나만 화면 가득 */
.layout>.memo,.layout>.mapbox,.layout>.content,.layout>.three{grid-column:1;grid-row:2;min-width:0}
.layout>.memo{border-right:0}
.viewbar{grid-column:1;grid-row:1;display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.viewbar button{flex:1 1 0;height:40px;border:0;background:none;color:var(--muted);font:inherit;font-size:.88rem;font-weight:600;cursor:pointer}
.viewbar button+button{border-left:1px solid var(--line)}
.viewbar button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--focus)}
.viewbar button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
@media (min-width:761px){.layout:not([data-view="map"])>.mapbox,.layout:not([data-view="board"]):not([data-view="plan"])>.content,.layout:not([data-view="three"])>.three,.layout:not([data-view="memo"])>.memo{display:none}}
/* 3D */
.three{position:relative;height:100%;background:#DDE2E0;overflow:hidden}
#threeView{position:absolute;inset:0;touch-action:none}
#threeView canvas{display:block}
.three .tools{position:absolute;left:12px;top:12px;z-index:3;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.three .tools button{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:.82rem;cursor:pointer}
.three .tools button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.three .tools label{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:.82rem;display:inline-flex;align-items:center;gap:8px}
.three .tools input[type=range]{width:110px}
/* 해: 아래 막대(날짜·시각·북쪽·재생) + 오른쪽 방별 햇빛 */
.three .sunbar[hidden]{display:none}
.three .sunbar{flex:1 0 100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.8rem}
.three .sunbar label{display:inline-flex;align-items:center;gap:6px;flex:1 1 220px;min-width:0}
.three .sunbar input[type=range]{flex:1;min-width:80px}
.three .sunbar output{min-width:7.5em;font-variant-numeric:tabular-nums;font-weight:600}
.three .sunbar button,.three .sunbar select{height:30px;border-radius:7px;border:1px solid var(--line);background:var(--page);color:var(--ink);font:inherit;padding:0 10px;cursor:pointer}
.three .sunbar .sunst{color:var(--muted);flex:1 0 100%;font-size:.76rem}
.three .sunpanel{position:absolute;right:12px;top:auto;bottom:12px;z-index:3;width:min(250px,calc(100% - 24px));max-height:calc(100% - 190px);overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.78rem}
.three .sunpanel h3{margin:0 0 6px;font-size:.8rem}
.three .sunpanel .row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin:5px 0}
.three .sunpanel .bar{grid-column:1/3;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.three .sunpanel .bar i{display:block;height:100%;background:#F2B233}
.three .sunpanel .hrs{color:var(--muted);font-variant-numeric:tabular-nums}
.three .sunpanel[hidden]{display:none}
/* 사람 눈높이로 걷기 */
.three .walkhud{position:absolute;left:12px;right:12px;top:12px;z-index:4;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.82rem}
.three .walkhud[hidden]{display:none}
.three .walkhud button{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--page);color:var(--ink);font:inherit;cursor:pointer}
.three .walkhud #walkName{font-weight:700}
.three .walkhud .walkhint{color:var(--muted);font-size:.76rem;flex:1}
.three .walkhud .walkpad{display:inline-flex;gap:6px}
.three .walkhud .walkpad button{width:44px;touch-action:none}
.three.walking .tools,.three.walking .sunpanel{display:none}
.three.walking #threeView{cursor:grab}
.three .hint{display:none;position:absolute;left:12px;bottom:12px;z-index:3;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.78rem}
/* 설계도: 프리폼과 같은 보드에 10×10 모눈종이(100평 정사각형)를 깔고 항목은 시트별로 따로 */
.content.plan-mode{background:#DDE2E0}
.content.plan-mode .item .tx{color:#000}
.content.plan-mode .item .rot{display:none!important}/* 설계도: 돌리기는 위쪽 막대로만 */
.content.plan-mode .empty{display:none}
.paper{position:absolute;pointer-events:none;overflow:visible;z-index:-1000000}
.paper .sheet{fill:#fff;stroke:none}
.paper .g{stroke:#000;stroke-width:1.5;vector-effect:non-scaling-stroke;fill:none}
.paper .b{stroke:#000;stroke-width:2.5;vector-effect:non-scaling-stroke;fill:none}
.paper .dl{stroke:#3D4A48;stroke-width:1.2;vector-effect:non-scaling-stroke;fill:none}
.paper text{fill:#3D4A48;font-family:inherit;text-anchor:middle}
.paper .t1{font-size:20px}
.paper .t2{font-size:30px;font-weight:700}
.layout>*{min-height:0}/* 긴 메모가 칸을 늘리지 않고 칸 안에서 스크롤되게 */
.tabs{display:none}
.memo{min-width:0;height:100%;display:flex;flex-direction:column;background:var(--page);border-right:1px solid var(--line)}
.memo .head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 0 16px}
.memo label{font-size:.72rem;letter-spacing:.08em;color:var(--muted);font-weight:600}
.fs{display:flex;align-items:center;gap:4px}
.fs button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;line-height:1}
.fs button:disabled{opacity:.4;cursor:default}
.fs button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.fs span{min-width:34px;text-align:center;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.memo .text{flex:1;min-height:0;width:100%;overflow-y:auto;border:0;outline:none;background:transparent;color:var(--ink);font:inherit;font-size:15px;line-height:1.65;padding:10px 16px 16px;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.memo>.text{display:none}/* 예전 한 장 메모 — 스티커로 옮긴 뒤 숨김 */
/* 스티커 메모: 카드마다 색·글, 살짝 기울여 붙인 느낌 */
.memo .add-note{margin-right:auto;margin-left:10px;height:28px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
.memo .notes{flex:1;min-height:0;overflow:auto;padding:14px 16px 16px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;align-content:start;font-size:15px}
.stk{background:var(--nc);color:#1D2524;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.28);display:flex;flex-direction:column;min-height:190px;transform:rotate(var(--tilt,0deg));transition:transform .15s,translate .22s ease}
/* 끌어서 순서 바꾸기: 위쪽 띠를 잡거나 카드를 길게 누름 */
.stk .nh{cursor:grab;touch-action:none}
.stk.ph{background:transparent;box-shadow:none;border:2px dashed var(--line);transform:none}
.stk.ph>*{visibility:hidden}
.stk.lift{position:fixed;z-index:50;pointer-events:none;transition:none;transform:rotate(2deg) scale(1.04);box-shadow:0 12px 28px rgba(0,0,0,.4);margin:0}
.notes.dragging,.notes.dragging *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
.stk:focus-within{transform:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.stk .nh{display:flex;gap:5px;align-items:center;padding:8px 8px 0 12px}
.stk .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25);background:var(--c);padding:0;cursor:pointer}
.stk .dot[aria-pressed="true"]{outline:2px solid #1D2524;outline-offset:1px}
.stk .nx{margin-left:auto;width:26px;height:26px;border:0;border-radius:50%;background:none;font-size:18px;line-height:1;cursor:pointer;color:rgba(0,0,0,.45)}
.stk .nx:hover{background:rgba(0,0,0,.08);color:#000}
.stk .nbody{flex:1;padding:6px 14px 14px;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;-webkit-user-select:text;user-select:text;cursor:text}
.stk .nbody:empty::before{content:"메모를 적으세요";color:rgba(0,0,0,.35);pointer-events:none}
.stk .nbody mark{background:rgba(255,196,0,.8);color:#000;border-radius:2px;padding:0 1px}
.memo .text:empty::before{content:attr(data-placeholder);color:var(--muted);pointer-events:none}
.memo .text mark{background:#FFE45C;color:#000;border-radius:2px;padding:0 1px}
.memo .text:focus-visible{outline:none}
.hl-btn{width:28px;height:28px;padding:0;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin-right:6px}
.hl-btn::before{content:"";width:14px;height:14px;border-radius:3px;background:#FFE45C;border:1px solid rgba(0,0,0,.15)}
.hl-btn:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.memo .saved{font-size:.72rem;color:var(--muted);padding:0 16px 10px;min-height:1.6em}
.mapbox{position:relative;width:100%;height:100%;min-height:0;background:rgb(7,23,51);touch-action:none}
.content{min-width:0;height:100%;position:relative;overflow:hidden;background:rgb(138,118,96);
  touch-action:none;cursor:grab;outline:none}
.content.panning{cursor:grabbing}
/* 프리폼: 빈 곳을 끌면 범위 선택 (화면 이동은 스페이스·가운데 버튼·휠·한 손가락) */
.content:not(.plan-mode){cursor:default}
.content.space{cursor:grab}
.marq{position:absolute;z-index:4;border:1px dashed var(--focus);background:color-mix(in srgb,var(--focus) 12%,transparent);pointer-events:none}
.item.gsel{outline:2px solid var(--focus);outline-offset:2px}
.content.drop{box-shadow:inset 0 0 0 3px var(--focus)}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.item{position:absolute;cursor:move;user-select:none;-webkit-user-drag:none}
.item img{display:block;width:100%;height:100%;pointer-events:none;border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.item.sel{outline:2px solid var(--focus);outline-offset:2px}
/* 손잡이는 확대·축소와 상관없이 화면에서 같은 크기 (--iz = 1/배율) */
.item .h{position:absolute;right:calc(-14px*var(--iz,1));bottom:calc(-14px*var(--iz,1));width:calc(26px*var(--iz,1));height:calc(26px*var(--iz,1));border-radius:50%;background:var(--panel);border:calc(2.5px*var(--iz,1)) solid var(--focus);cursor:nwse-resize;display:none}
.item.sel .h{display:block}
.item.txt{width:auto!important;height:auto!important}
.item .tx{color:#fff;font-weight:700;line-height:1.25;white-space:pre;padding:.05em .15em;outline:none;min-width:.5em;cursor:inherit}
.item .tx[contenteditable="true"]{cursor:text;user-select:text;-webkit-user-select:text;background:rgba(0,0,0,.25)}
.item.editing .h{display:none}
.item .rot{position:absolute;right:calc(-12px*var(--iz,1));top:calc(-12px*var(--iz,1));width:calc(22px*var(--iz,1));height:calc(22px*var(--iz,1));border-radius:50%;background:var(--panel);border:calc(2px*var(--iz,1)) solid var(--focus);color:var(--focus);font-size:calc(14px*var(--iz,1));line-height:1;cursor:pointer;display:none;place-items:center;user-select:none}
.item.sel .rot{display:grid}
.item.editing .rot{display:none}
.item svg.arw{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.item svg.arw path{fill:#000}
.item .box{width:100%;height:100%;background:rgb(115,98,79);border-radius:2px;display:flex;align-items:center;justify-content:center}/* 보드 배경(138,118,96)보다 조금 어둡게 */
/* 네모 안 글자: 두 번 눌러 쓰기, 가운데 정렬 */
.item .bt{color:#fff;font-weight:700;line-height:1.25;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;padding:0 .2em;outline:none;cursor:inherit}
.item .bt:empty{display:none}
/* 네모 색 (연한 색이면 테두리와 진한 글자) */
.item .box.light{border:1px solid rgba(0,0,0,.28)}
.item .box.light .bt{color:#1D2524}
/* 글상자: 테두리 있는 흰 상자, 글자는 왼쪽 위부터 줄바꿈 */
.item .tbox{width:100%;height:100%;background:#fff;border:1.5px solid #3D4A48;border-radius:3px;padding:.3em .45em;overflow:hidden}
.item .tbt{color:#1D2524;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;outline:none;min-height:1.35em;cursor:inherit}
.item .tbt[contenteditable="true"]{cursor:text;user-select:text;-webkit-user-select:text}
.content.plan-mode .item .tbt{text-align:center}/* 설계도 글상자는 가운데 정렬 */
.tools .tbox-btn{font-weight:600}
/* 문·창 기호 (설계도에서만 추가). 선은 화면 기준 굵기, 반전은 안쪽 그림만 */
.item svg.sym{display:block;width:100%;height:100%;overflow:visible}
.sym .ln{fill:none;stroke:#1D2524;stroke-width:2.4;vector-effect:non-scaling-stroke;stroke-linecap:square}
.sym .tn{fill:none;stroke:#1D2524;stroke-width:1.2;vector-effect:non-scaling-stroke}
.sym .ds{stroke-dasharray:4 3}
.sym .fl{fill:#fff;stroke:#1D2524;stroke-width:1.6;vector-effect:non-scaling-stroke}
.content:not(.plan-mode) .plan-only,.content.plan-mode .free-only{display:none!important}
.sym .dk{fill:#1D2524;stroke:none}
.sympop .sym .dk{fill:currentColor}
.iconpop .opts{width:min(440px,calc(100vw - 48px))}
.iconpop{max-height:calc(100% - 70px);overflow-y:auto}/* 아이콘이 많아도 화면 안에서 스크롤 */
.sympop{min-width:0}
.sympop .opts{flex-wrap:wrap;width:min(330px,calc(100vw - 48px))}
.sympop svg{width:44px;height:38px;overflow:visible}
.sympop .sym .ln,.sympop .sym .tn{stroke:currentColor}
.sympop .sym .fl{fill:var(--panel);stroke:currentColor}
.tools .grp{display:inline-flex;gap:4px;align-items:center}
/* 설계도 칸 색 고르기 */
.cellpop .opts{flex-wrap:wrap;width:min(400px,calc(100vw - 48px))}
.tools .swatches{display:inline-flex;gap:4px;align-items:center;height:32px;padding:0 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.tools .swatches button{width:22px;height:22px;padding:0;border-radius:50%;border:1px solid rgba(0,0,0,.3);background:var(--c)}
.tools .swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--focus);border-color:transparent;font-weight:400}
.item .bt[contenteditable="true"]{display:block;min-width:1em;cursor:text;user-select:text;-webkit-user-select:text;background:rgba(0,0,0,.25)}
/* 펜 낙서: 상자 전체가 아니라 선 위에서만 잡히게 (아래 이미지를 가리지 않도록) */
.item.ink,.item.frm{pointer-events:none}
.item.ink>.h,.item.ink>.rot,.item.ink>.del,.item.frm>.h,.item.frm>.rot,.item.frm>.del{pointer-events:auto}
/* 테두리 네모: 선 위에서만 잡히고 안쪽은 아래 항목을 그대로 누를 수 있게 */
.item svg.frm{display:block;width:100%;height:100%;overflow:visible}
.item svg.frm .fr{fill:none}
.item svg.frm .hit{fill:none;stroke:transparent;pointer-events:stroke}
.tools .frame-btn::before{content:"";width:10px;height:10px;border:1.5px solid currentColor;margin-right:6px}
.item svg.ink{display:block;width:100%;height:100%;overflow:visible}
.item svg.ink .ln{fill:none;stroke:#000;stroke-linecap:round;stroke-linejoin:round}
.item svg.ink .hit{fill:none;stroke:transparent;stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke}
.item.ink.sel{outline-style:dashed}
.content.pen,.content.pen .item{cursor:crosshair}
.live{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:2147483646}
.tools button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.tools .eraser-btn::before{content:"";width:10px;height:7px;border-radius:2px;border:1.5px solid currentColor;margin-right:6px;transform:rotate(-30deg)}
.content.eraser,.content.eraser .item{cursor:cell}
/* 묶음 사이 간격: [편집 중] · [전체 보기] · [펜 지우개] · [화살표] */
.tools .mode-btn,.tools #fitBtn,.tools .eraser-btn{margin-right:14px}
.tools .pen-btn::before{content:"";width:8px;height:8px;border-radius:50%;background:#000;margin-right:6px}
.tools .mode-btn{font-weight:600}
.ro .tools [data-edit]{display:none}
.guide{position:absolute;background:#FF2D95;pointer-events:none;z-index:2147483647}
.tools{position:absolute;left:12px;top:12px;display:flex;gap:6px;align-items:center;z-index:3;flex-wrap:wrap}
.tools button,.tools label.b{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center}
.tools button:focus-visible,.tools label.b:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.tools button:disabled{opacity:.4;cursor:default}
.tools .zv{font-size:.75rem;color:var(--muted);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:rgba(255,255,255,.8);font-size:.95rem;text-align:center;line-height:1.7}
.item .del{position:absolute;left:calc(-12px*var(--iz,1));top:calc(-12px*var(--iz,1));width:calc(24px*var(--iz,1));height:calc(24px*var(--iz,1));border-radius:50%;background:var(--panel);border:calc(2px*var(--iz,1)) solid var(--red);color:var(--red);font-size:calc(15px*var(--iz,1));line-height:1;display:none;place-items:center;user-select:none}
@media (pointer:coarse){.item.sel .del{display:grid}.item.editing .del{display:none}}
.note{position:absolute;left:12px;bottom:12px;z-index:3;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.8rem;max-width:calc(100% - 24px)}
.login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);padding:16px}
.login form{width:min(340px,100%);display:flex;flex-direction:column;gap:10px}
.login h1{margin:0 0 4px;font-size:1.4rem;font-weight:600;text-wrap:balance}
.login p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.5}
.login input{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:16px;padding:0 14px}
.login input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.login button{height:46px;border-radius:10px;border:0;background:var(--ink);color:var(--page);font:inherit;font-size:1rem;font-weight:600;cursor:pointer}
.login button:disabled{opacity:.5;cursor:default}
.login button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* 휴대폰: 세 칸을 탭으로 나눠 한 번에 하나씩 */
@media (max-width:760px){
  .layout{display:block;position:relative}
  .memo .notes{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .viewbar{display:none}
  .layout>[data-pane]{height:100%;border:0}
  .layout>[data-pane]:not(.on){display:none}
  .tabs{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs button{flex:1;height:52px;border:0;background:none;color:var(--muted);font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
  .tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 2px 0 var(--focus)}
  .tabs button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
}
svg#map{width:100%;height:100%;display:block;cursor:pointer;user-select:none}
.muni{fill:var(--land);stroke:var(--border-muni);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .15s}
.muni:hover{fill:color-mix(in srgb,var(--land) 82%,var(--ink))}
.muni.c-red{fill:var(--red)} .muni.c-blue{fill:var(--blue)} .muni.c-green{fill:var(--green)}
.muni.c-red:hover,.muni.c-blue:hover,.muni.c-green:hover{filter:brightness(1.08)}
.muni.sel{stroke:var(--ink);stroke-width:2.5}
.muni:focus-visible{outline:none;stroke:var(--focus);stroke-width:2.5}
.prov{fill:none;stroke:var(--border-prov);stroke-width:1.6;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.lbl{fill:var(--label);text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:var(--label-halo);stroke-width:.25em;font-weight:500}
.lbl.on{fill:#fff;stroke:rgba(0,0,0,.3)}
.hw-case{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.hw{fill:none;stroke:#1A1A1A;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.layers{position:absolute;left:12px;top:12px;z-index:4;display:flex;gap:6px;flex-wrap:wrap}
.layers button{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.layers button::before{content:"";width:14px;height:3px;border-radius:2px;background:var(--muted);opacity:.5}
.layers button.dot::before{width:10px;height:10px;border-radius:50%}
.layers button[aria-pressed="true"]{border-color:var(--c);font-weight:600}
.layers button[aria-pressed="true"]::before{background:var(--c);opacity:1}
.rl{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.st{fill:#fff;stroke:#222;stroke-width:1.3px;vector-effect:non-scaling-stroke;pointer-events:none}
.ap{pointer-events:none}
.ap circle{fill:#6D4AFF;stroke:#fff;stroke-width:1.5px;vector-effect:non-scaling-stroke}
.ap .pl{fill:#fff}
.ap text{fill:var(--label);font-size:11px;font-weight:600;paint-order:stroke;stroke:var(--label-halo);stroke-width:3px;dominant-baseline:central}
.layers button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.pop{position:absolute;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pop .name{font-size:.85rem;font-weight:600;padding-inline:2px}
.pop .opts{display:flex;gap:6px}
.pop button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;border:1.5px solid transparent;border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:.78rem;cursor:pointer}
.pop button:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.pop button[aria-current="true"]{border-color:var(--ink)}
.pop .sw{width:26px;height:26px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.12)}
.pop button[data-c="none"] .sw{background:repeating-linear-gradient(45deg,var(--land) 0 4px,var(--line) 4px 8px)}
.pop button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<div class="app">
<div class="layout" id="layout" data-view="map">
<nav class="viewbar" role="tablist" aria-label="화면">
  <button type="button" role="tab" data-tab="memo" aria-selected="false">메모</button>
  <button type="button" role="tab" data-tab="map" aria-selected="true">위치</button>
  <button type="button" role="tab" data-tab="board" aria-selected="false">프리폼</button>
  <button type="button" role="tab" data-tab="plan" aria-selected="false">설계도</button>
  <button type="button" role="tab" data-tab="three" aria-selected="false">3D</button>
</nav>
<section class="three" data-pane="three" aria-label="설계도 3D">
  <div id="threeView"></div>
  <div class="tools">
    <button type="button" data-v3="tilt">비스듬히</button>
    <button type="button" data-v3="top">위에서</button>
    <button type="button" id="wallsBtn" aria-pressed="true" title="네모(방) 둘레에 벽 세우기">벽</button>
    <label>벽 높이 <input type="range" id="wallH" min="0.3" max="3.5" step="0.1" value="2.4"><span id="wallHv">2.4 m</span></label>
    <button type="button" id="labelsBtn" aria-pressed="true" title="텍스트를 방 이름표로 띄우기 — 이름표를 누르면 그 방에 들어가 사람 눈높이로 둘러봐요">이름표</button>
    <label>담장 <input type="range" id="fenceH" min="0" max="3" step="0.1" value="1.4"><span id="fenceHv">1.4 m</span></label>
    <button type="button" id="roofBtn" aria-pressed="false" title="박공지붕 씌우기 (중정은 열어 둠)">지붕</button>
    <button type="button" id="sunBtn" aria-expanded="false" title="날짜·시각에 따른 해와 방별 햇빛">☀ 일조량</button>
    <div class="sunbar" id="sunBar" hidden>
      <label>날짜 <input type="range" id="sunDay" min="1" max="365" step="1"><output id="sunDayV"></output></label>
      <label>시각 <input type="range" id="sunTime" min="5" max="20" step="0.25" value="15"><output id="sunTimeV"></output></label>
      <button type="button" id="sunPlay" aria-pressed="false" title="하루 동안 해 움직이기">▶ 하루</button>
      <select id="sunNorth" title="설계도에서 북쪽이 어느 쪽인지"><option value="auto">북쪽: 정문 쪽(자동)</option><option value="0">북쪽: 위</option><option value="90">북쪽: 오른쪽</option><option value="180">북쪽: 아래</option><option value="270">북쪽: 왼쪽</option></select>
      <div class="sunst" id="sunState"></div>
    </div>
  </div>
  <div class="walkhud" id="walkHud" hidden>
    <button type="button" id="walkExit">← 나가기</button><span id="walkName"></span>
    <span class="walkhint">끌어서 둘러보기 · W/S·↑↓ 앞뒤 · A/D·←→ 옆으로 · 왼쪽 Shift 빨리 · Space/Tab 위아래 · 휠</span>
    <span class="walkpad"><button type="button" data-walk="1" aria-label="앞으로">▲</button><button type="button" data-walk="-1" aria-label="뒤로">▼</button></span>
  </div>
  <div class="sunpanel" id="sunPanel" hidden><h3>방별 햇빛</h3><div id="sunRooms"></div></div>
  <div class="hint">끌어서 돌리기 · 휠/두 손가락으로 확대 · 오른쪽 버튼(두 손가락 끌기)으로 이동 — 설계도를 바꾸면 자동으로 다시 그려요</div>
</section>
<div class="mapbox on" id="mapbox" data-pane="map">
  <svg id="map" role="img" aria-label="대한민국 시군 지도"></svg>
  <div class="layers" role="group" aria-label="지도 레이어">
    <button type="button" id="lyHw" aria-pressed="false" style="--c:#1A1A1A">고속도로</button>
    <button type="button" id="lyRl" aria-pressed="false" style="--c:#B71C1C">고속철도</button>
    <button type="button" id="lyAp" class="dot" aria-pressed="false" style="--c:#6D4AFF">국제공항</button>
  </div>
  <div class="pop" id="pop" role="dialog" aria-label="색 선택" hidden>
    <div class="name" id="popName"></div>
    <div class="opts">
      <button type="button" data-c="red" style="--c:var(--red)"><span class="sw"></span>빨강</button>
      <button type="button" data-c="blue" style="--c:var(--blue)"><span class="sw"></span>파랑</button>
      <button type="button" data-c="green" style="--c:var(--green)"><span class="sw"></span>초록</button>
      <button type="button" data-c="none"><span class="sw"></span>지우기</button>
    </div>
  </div>
</div>
<section class="memo" data-pane="memo">
  <div class="head">
    <label id="memoLbl">메모</label>
    <button type="button" id="addNote" class="add-note">+ 새 메모</button>
    <div class="fs" role="group" aria-label="글자 크기">
      <button type="button" class="hl-btn" id="hlBtn" title="형광펜: 고른 글자에 칠하기·지우기 (⌘⇧H)" aria-label="형광펜"></button>
      <button type="button" id="fsDown" aria-label="글자 작게">A−</button>
      <span id="fsVal">15px</span>
      <button type="button" id="fsUp" aria-label="글자 크게">A+</button>
    </div>
  </div>
  <div id="memo" class="text" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="memoLbl" data-placeholder="여기에 메모를 적으세요" spellcheck="false" autocorrect="off" autocapitalize="off"></div>
  <div class="notes" id="notes" aria-label="스티커 메모"></div>
  <div class="saved" id="saved"></div>
</section>
<main class="content" id="board" tabindex="0" aria-label="설계도 보드" data-pane="board">
  <div class="world" id="world"></div>
  <div class="empty" id="empty">이미지를 붙여넣거나(⌘V / Ctrl+V)<br>파일을 끌어다 놓으세요<br>빈 곳을 더블클릭하면 글자를 넣을 수 있어요</div>
  <div class="tools">
    <button type="button" id="modeBtn" class="mode-btn" aria-pressed="false" title="읽기 전용이면 보드를 바꿀 수 없어요">편집 중</button>
    <button type="button" id="fitBtn">전체 보기</button>
    <button type="button" id="penBtn" class="pen-btn" data-edit aria-pressed="false" title="펜 (P)">펜</button>
    <button type="button" id="eraserBtn" class="eraser-btn" data-edit aria-pressed="false" title="지우개: 문지른 펜 선을 지워요 (E)">지우개</button>
    <button type="button" data-edit id="rectBtn" aria-label="네모 추가" title="네모 (맨 뒤에 놓여요)">□</button>
    <button type="button" data-edit id="frameBtn" class="frame-btn" title="테두리만 있는 네모 (안쪽은 비어 있어요)">테두리</button>
    <button type="button" data-edit id="tboxBtn" class="tbox-btn" title="테두리 안에 글을 써요"><span class="free-only">글상자</span><span class="plan-only">텍스트</span></button>
    <button type="button" data-edit id="doorBtn" class="plan-only" aria-haspopup="dialog" aria-expanded="false" title="문 기호: 여닫이·양여닫이·미닫이">문</button>
    <button type="button" data-edit id="winBtn" class="plan-only" aria-haspopup="dialog" aria-expanded="false" title="창 기호: 창문·슬릿">창</button>
    <button type="button" data-edit id="iconBtn" class="plan-only" aria-haspopup="dialog" aria-expanded="false" title="가구·설비 아이콘 (실제 크기)">아이콘</button>
    <button type="button" data-edit class="free-only" data-arw="180" aria-label="왼쪽 화살표 추가">←</button>
    <button type="button" data-edit class="free-only" data-arw="270" aria-label="위쪽 화살표 추가">↑</button>
    <button type="button" data-edit class="free-only" data-arw="0" aria-label="오른쪽 화살표 추가">→</button>
    <button type="button" data-edit class="free-only" data-arw="90" aria-label="아래쪽 화살표 추가">↓</button>
    <span class="swatches" id="rectColors" data-edit role="group" aria-label="네모 색" hidden></span>
    <span class="swatches" id="frameColors" data-edit role="group" aria-label="테두리 색" hidden></span>
    <span class="grp" id="symTools" data-edit role="group" aria-label="기호 돌리기·뒤집기" hidden>
      <button type="button" data-sym-act="rot" title="90° 돌리기 (R, 반대로 ⇧R)">↻ 90°</button>
      <button type="button" data-sym-act="fx" title="좌우 뒤집기 (H)">⇋ 좌우</button>
      <button type="button" data-sym-act="fy" title="상하 뒤집기 (V)">⇅ 상하</button>

    </span>
    <span class="zv" id="zv">100%</span>
    <button type="button" id="exportBtn" hidden>내보내기</button>
    <label class="b" id="importLbl" hidden>가져오기<input type="file" id="importIn" accept="application/json,.json" hidden></label>
  </div>
  <div class="pop sympop" id="doorPop" role="dialog" aria-label="문 기호" hidden>
    <div class="name">문</div>
    <div class="opts"></div>
  </div>
  <div class="pop sympop" id="winPop" role="dialog" aria-label="창 기호" hidden>

    <div class="opts"></div>

  <div class="note" id="note" hidden></div>
</main>
</div>
<div class="login" id="login" hidden>
  <form id="loginForm">
    <h1>주택 설계</h1>
    <p id="loginMsg">한 번 로그인하면 이 기기에서는 계속 유지돼요.</p>

const noBg=/^(transparent|rgba\(0, 0, 0, 0\)|initial|inherit)?$/;
function memoHTML(el=memo){let out="";
  const walk=(n,hl)=>{for(const c of n.childNodes){
    if(c.nodeType===3){if(c.data)out+=hl?`<mark>${esc(c.data)}</mark>`:esc(c.data);}
    else if(c.nodeName==="BR")out+="<br>";
    else if(c.nodeType===1){
      if(/^(DIV|P|LI)$/.test(c.nodeName)&&out&&!out.endsWith("<br>"))out+="<br>";// 줄 나눔
      const bg=c.style&&c.style.backgroundColor;
      walk(c,c.nodeName==="MARK"?!(bg&&noBg.test(bg)&&bg!==""):bg?!noBg.test(bg):hl);}}};
  walk(el,false);return out.replace(/<\/mark><mark>/g,"");}
let HL=null;// 형광펜을 칠할 곳: 고른 글자가 있는 스티커 메모(없으면 예전 메모)
function setMemoHTML(h){memo.innerHTML=h;}

  if((ev.metaKey||ev.ctrlKey)&&ev.shiftKey&&ev.code==="KeyH"){ev.preventDefault();toggleHL();}});
memo.addEventListener("paste",ev=>{const t=ev.clipboardData?.getData("text/plain");if(t==null||ev.clipboardData.files?.length)return;
  ev.preventDefault();ev.stopPropagation();document.execCommand("insertText",false,t);});
// 형광펜: 고른 부분이 모두 칠해져 있으면 지우고, 아니면 칠함.
// 브라우저 기본 명령(hiliteColor)은 줄을 넘는 선택·Safari에서 들쭉날쭉해서, 글자마다 칠함 여부를 직접 바꾼 뒤 다시 그림
const isHLn=n=>{for(;n&&n!==HL;n=n.parentNode)if(n.nodeType===1){const bg=n.style.backgroundColor;
    if(bg)return !noBg.test(bg);if(n.nodeName==="MARK")return true;}return false;};

function modelHTML(ch){let out="",open=false;
  for(const [c,h] of ch){if(c==="\n"){if(open){out+="</mark>";open=false;}out+="<br>";continue;}
    if(h!==open){out+=h?"<mark>":"</mark>";open=h;}out+=esc(c);}
  return out+(open?"</mark>":"");}
function toggleHL(){const sel=getSelection(),anc=sel.rangeCount&&sel.getRangeAt(0).commonAncestorContainer;
  HL=[...document.querySelectorAll(".stk .nbody")].find(b=>anc&&b.contains(anc))||memo;
  if(!sel.rangeCount||sel.isCollapsed||!HL.contains(anc)){note("메모에서 칠할 글자를 먼저 고르세요.");return;}
  const o=memoOffsets(),ch=memoModel(),part=ch.slice(o[0],o[1]).filter(([c])=>c!=="\n");
  const on=part.length&&part.every(([,h])=>h);
  for(let i=o[0];i<o[1]&&i<ch.length;i++)if(ch[i][0]!=="\n")ch[i][1]=!on;

const hlBtn=document.getElementById("hlBtn");
hlBtn.addEventListener("pointerdown",ev=>ev.preventDefault());// 버튼을 눌러도 메모의 선택이 풀리지 않게
hlBtn.addEventListener("mousedown",ev=>ev.preventDefault());

// 메모 안 선택 위치를 글자 수로 기억했다가 다시 고르기 (줄바꿈 <br>은 한 글자로 셈)
function memoWalk(fn){const w=document.createTreeWalker(HL,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n,pos=0;
  while(n=w.nextNode()){const len=n.nodeType===3?n.data.length:n.nodeName==="BR"?1:0;if(len&&fn(n,pos,len))return;pos+=len;}}
function memoOffsets(){const sel=getSelection();if(!sel.rangeCount)return null;const r=sel.getRangeAt(0),out=[0,0];
  [[r.startContainer,r.startOffset,0],[r.endContainer,r.endOffset,1]].forEach(([c,off,k])=>{
    if(c.nodeType===3){memoWalk((n,pos)=>{if(n===c){out[k]=pos+off;return true;}});}
    else{const pre=document.createRange();pre.selectNodeContents(HL);pre.setEnd(c,off);
      const f=pre.cloneContents(),t=document.createTreeWalker(f,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n,p=0;
      while(n=t.nextNode())p+=n.nodeType===3?n.data.length:n.nodeName==="BR"?1:0;out[k]=p;}});

function memoSelect(o){if(!o)return;const r=document.createRange();let set=[false,false];
  memoWalk((n,pos,len)=>{for(const k of [0,1])if(!set[k]&&o[k]<=pos+len){

      else(k?r.setEndAfter:r.setStartAfter).call(r,n);set[k]=true;}
    return set[0]&&set[1];});
  if(!set[0])r.setStart(HL,HL.childNodes.length);if(!set[1])r.setEnd(HL,HL.childNodes.length);
  const sel=getSelection();sel.removeAllRanges();sel.addRange(r);}

// ===== 스티커 메모: 카드마다 따로 (글·색), 새 메모는 맨 앞 =====
// 클라우드는 notes/<id> {html,color,t} 하나씩, 아니면 이 기기(kr-notes). 예전 한 장 메모는 처음 한 번 첫 스티커로 옮김
const NOTE_COLORS=[["yellow","#FFF1A6"],["pink","#FFD3DE"],["blue","#CFE6FF"],["green","#D6F2C9"],["purple","#E6DAFA"],["orange","#FFDDB8"]];
const notesBox=document.getElementById("notes");let notes=[];const stkT={},noteSynced={},noteRecent={};
const nkey=n=>n.o??-n.t;// 순서: o가 있으면 그것, 없으면 최근 것이 앞
const noteColor=k=>(NOTE_COLORS.find(c=>c[0]===k)||NOTE_COLORS[0])[1];
function saveNotesLocal(){if(cloud.db)return;try{localStorage.setItem("kr-notes",JSON.stringify(notes))}catch(e){}}
function saveNote(n){if(cloud.db){const d={html:n.html,color:n.color,t:n.t};if(n.o!=null)d.o=n.o;noteSynced[n.id]=JSON.stringify(d);noteRecent[n.id]=Date.now();put("notes/"+n.id,d);saved.textContent="저장됨 · 모든 기기";}
  else{saveNotesLocal();saved.textContent="저장됨";}}
function noteCard(n,i){const el=document.createElement("div");el.className="stk";el.dataset.id=n.id;
  el.style.setProperty("--nc",noteColor(n.color));el.style.setProperty("--tilt",[-.7,.5,-.3,.8,-.5,.3][[...n.id].reduce((a,c)=>a+c.charCodeAt(0),0)%6]+"deg");
  const nh=document.createElement("div");nh.className="nh";
  for(const [k,c] of NOTE_COLORS){const b=document.createElement("button");b.type="button";b.className="dot";b.style.setProperty("--c",c);b.title=b.ariaLabel="색: "+k;
    b.setAttribute("aria-pressed",n.color===k);b.onclick=()=>{n.color=k;el.style.setProperty("--nc",c);nh.querySelectorAll(".dot").forEach(d=>d.setAttribute("aria-pressed",d===b));saveNote(n);};nh.append(b);}
  const x=document.createElement("button");x.type="button";x.className="nx";x.textContent="×";x.title=x.ariaLabel="이 메모 지우기";
  x.onclick=()=>{if(body.textContent.trim()&&!confirm("이 메모를 지울까요?"))return;notes=notes.filter(o=>o!==n);el.remove();
    if(cloud.db){delete noteSynced[n.id];noteRecent[n.id]=Date.now();del("notes/"+n.id);}else saveNotesLocal();};nh.append(x);
  const body=document.createElement("div");body.className="nbody";body.contentEditable="true";body.spellcheck=false;body.setAttribute("role","textbox");body.setAttribute("aria-multiline","true");body.innerHTML=n.html||"";
  body.addEventListener("input",()=>{n.html=memoHTML(body);clearTimeout(stkT[n.id]);saved.textContent="";stkT[n.id]=setTimeout(()=>saveNote(n),cloud.db?600:400);});
  body.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&!ev.isComposing){ev.preventDefault();document.execCommand("insertLineBreak");}
    if((ev.metaKey||ev.ctrlKey)&&ev.shiftKey&&ev.code==="KeyH"){ev.preventDefault();toggleHL();}});
  body.addEventListener("paste",ev=>{const t=ev.clipboardData?.getData("text/plain");if(t==null||ev.clipboardData.files?.length)return;ev.preventDefault();ev.stopPropagation();document.execCommand("insertText",false,t);});
  el.append(nh,body);noteDrag(el,nh,body);return el;}
function drawNotes(){if(ND)return void(ND.redraw=true);const act=document.activeElement,keep=act&&act.closest&&act.closest(".stk")?.dataset.id;
  notes.sort((a,b)=>nkey(a)-nkey(b));

  const els=notes.map((n,i)=>{if(n.id===keep){const e=notesBox.querySelector(`.stk[data-id="${n.id}"]`);if(e)return e;}return noteCard(n,i);});
  [...notesBox.children].forEach(c=>{if(!els.includes(c))c.remove();});els.forEach(e=>notesBox.append(e));}
// ── 스티커 끌어서 순서 바꾸기 (폰 앱 아이콘처럼 다른 카드가 밀려 자리 생김) ──
let ND=null,press=null;
function noteDrag(el,nh,body){
  const down=(ev,fromHead)=>{if(ev.button>0||ND)return;if(fromHead&&ev.target.closest("button"))return;
    press={el,x:ev.clientX,y:ev.clientY,head:fromHead,t:fromHead?0:setTimeout(()=>{if(press&&press.el===el){dragStart(press);navigator.vibrate?.(15);}},380)};};
  nh.addEventListener("pointerdown",ev=>down(ev,true));
  body.addEventListener("pointerdown",ev=>down(ev,false));}
function dragStart(pr){const el=pr.el;press=null;if(!el.isConnected)return;const r=el.getBoundingClientRect();window.getSelection()?.removeAllRanges();document.activeElement?.blur?.();
  const ph=document.createElement("div");ph.className="stk ph";ph.style.height=r.height+"px";el.before(ph);
  el.classList.add("lift");Object.assign(el.style,{width:r.width+"px",height:r.height+"px",left:r.left+"px",top:r.top+"px"});
  notesBox.classList.add("dragging");ND={el,ph,dx:pr.x-r.left,dy:pr.y-r.top,x:pr.x,y:pr.y,id:el.dataset.id};scrollLoop();}
document.addEventListener("pointermove",ev=>{
  if(press&&!ND){const m=Math.hypot(ev.clientX-press.x,ev.clientY-press.y);
    if(press.head&&m>4){ev.preventDefault();dragStart(press);}else if(!press.head&&m>8){clearTimeout(press.t);press=null;}}
  if(ND){ev.preventDefault();ND.x=ev.clientX;ND.y=ev.clientY;dragMove();}},{passive:false});
document.addEventListener("touchmove",ev=>{if(ND)ev.preventDefault();},{passive:false});// 끄는 중엔 화면 스크롤 막음
{const up=()=>{if(press){clearTimeout(press.t);press=null;}if(ND)dragEnd();};

  document.addEventListener("contextmenu",ev=>{if(ND)ev.preventDefault();});}
function dragMove(){const {el,ph}=ND;el.style.left=ND.x-ND.dx+"px";el.style.top=ND.y-ND.dy+"px";
  // 손가락 아래 카드 자리로 빈칸을 옮김 — 앞쪽 절반이면 그 앞, 뒤쪽 절반이면 그 뒤
  const cards=[...notesBox.children].filter(c=>c!==el&&c!==ph);let tgt=null,after=false;
  for(const c of cards){const r=c.getBoundingClientRect();if(ND.x>=r.left&&ND.x<=r.right&&ND.y>=r.top&&ND.y<=r.bottom){tgt=c;after=ND.x>r.left+r.width/2;break;}}

    c.style.transition="none";c.style.translate=dx+"px "+dy+"px";c.offsetWidth;c.style.transition="";c.style.translate="0px 0px";}}
function scrollLoop(){if(!ND)return;const r=notesBox.getBoundingClientRect(),e=50;
  const v=ND.y<r.top+e?-12:ND.y>r.bottom-e?12:0;if(v){notesBox.scrollTop+=v;dragMove();}requestAnimationFrame(scrollLoop);}
function dragEnd(){const {el,ph,id}=ND;ph.replaceWith(el);el.classList.remove("lift");el.style.width=el.style.height=el.style.left=el.style.top="";

  const order=[...notesBox.children].map(c=>c.dataset.id),i=order.indexOf(id),n=notes.find(o=>o.id===id);
  const k=x=>{const m=notes.find(o=>o.id===x);return m?nkey(m):null;},p=i>0?k(order[i-1]):null,q=i<order.length-1?k(order[i+1]):null;

  if(n&&!((p==null||nkey(n)>p)&&(q==null||nkey(n)<q))){n.o=no;saveNote(n);}
  [...notesBox.children].forEach(c=>c.style.translate="");if(redraw)drawNotes();}
function addNote(html=""){const n={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),html,color:"yellow",t:Date.now()};
  n.o=(notes.length?Math.min(...notes.map(nkey)):0)-1;notes.unshift(n);drawNotes();saveNote(n);return n;}
document.getElementById("addNote").onclick=()=>{const n=addNote();notesBox.querySelector(`.stk[data-id="${n.id}"] .nbody`)?.focus();};
function applyNotes(snap){const seen=new Set();
  for(const d of snap.docs){const data=d.data(),id=d.id,js=JSON.stringify({html:data.html,color:data.color,t:data.t,...(data.o!=null&&{o:data.o})});seen.add(id);noteSynced[id]=js;
    let n=notes.find(o=>o.id===id);const typing=document.activeElement&&document.activeElement.closest?.(`.stk[data-id="${id}"]`);
    if(n){if(!typing){n.html=data.html||"";n.color=data.color||"yellow";}n.t=data.t||n.t;if(data.o!=null)n.o=data.o;}else notes.push({id,html:data.html||"",color:data.color||"yellow",t:data.t||0,...(data.o!=null&&{o:data.o})});}

// 예전 한 장 메모 → 첫 스티커 (스티커가 하나도 없고 아직 옮긴 적 없을 때 한 번)

function penStart(ev){const p=boardPoint(ev.clientX,ev.clientY),sw=4/cam.z;
  const svgEl=document.createElementNS(NS,"svg");svgEl.setAttribute("class","live");svgEl.setAttribute("width",1);svgEl.setAttribute("height",1);
  const path=document.createElementNS(NS,"path");path.setAttribute("fill","none");path.setAttribute("stroke","#000");
  path.setAttribute("stroke-width",sw);path.setAttribute("stroke-linecap","round");path.setAttribute("stroke-linejoin","round");
  svgEl.append(path);world.append(svgEl);stroke={pts:[[p.x,p.y]],sw,svgEl,path};path.setAttribute("d",inkPath(stroke.pts));}
function penMove(ev){const p=boardPoint(ev.clientX,ev.clientY),l=stroke.pts[stroke.pts.length-1];
  if(Math.hypot(p.x-l[0],p.y-l[1])<1.5/cam.z)return;// 화면에서 1.5px 미만 움직임은 건너뜀
  stroke.pts.push([p.x,p.y]);stroke.path.setAttribute("d",inkPath(stroke.pts));}
function penEnd(cancel){if(!stroke)return;const st=stroke;stroke=null;st.svgEl.remove();if(cancel)return;
  let pts=st.pts;if(pts.length===1)pts=[pts[0],[pts[0][0]+.01,pts[0][1]]];// 톡 찍은 점
  const pad=st.sw,xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x=Math.min(...xs)-pad,y=Math.min(...ys)-pad;
  const w=Math.max(...xs)+pad-x,h=Math.max(...ys)+pad-y,r=v=>Math.round(v*10)/10;
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const it={id,type:"ink",x,y,w,h,z:++topZ,vw:r(w),vh:r(h),sw:r(st.sw*10)/10||st.sw,pts:pts.map(p=>[r(p[0]-x),r(p[1]-y)])};

const eraserBtn=document.getElementById("eraserBtn");let eraserOn=false,erasing=false;
function setEraser(on){eraserOn=on&&!readOnly;eraserBtn.setAttribute("aria-pressed",eraserOn);board.classList.toggle("eraser",eraserOn);if(eraserOn){setPen(false);select(null);}}

function segDist(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((px-a[0])*dx+(py-a[1])*dy)/l)):0;
  return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy);}
function inkHit(it,p){// 보드 좌표 p가 선에서 (화면 기준 10px 안쪽)으로 가까운지
  const cx=it.x+it.w/2,cy=it.y+it.h/2,a=-(it.rot||0)*Math.PI/180;// 회전 풀기
  let x=cx+(p.x-cx)*Math.cos(a)-(p.y-cy)*Math.sin(a),y=cy+(p.x-cx)*Math.sin(a)+(p.y-cy)*Math.cos(a);
  const kx=it.vw/it.w,ky=it.vh/it.h,lx=(x-it.x)*kx,ly=(y-it.y)*ky,tol=10/cam.z*Math.max(kx,ky)+it.sw/2;
  if(lx<-tol||ly<-tol||lx>it.vw+tol||ly>it.vh+tol)return false;
  for(let i=1;i<it.pts.length;i++)if(segDist(lx,ly,it.pts[i-1],it.pts[i])<=tol)return true;
  return it.pts.length===1&&Math.hypot(lx-it.pts[0][0],ly-it.pts[0][1])<=tol;}
function eraseAt(ev){const p=boardPoint(ev.clientX,ev.clientY);let hit=false;
  for(const it of vis())if(it.type==="ink"&&inkHit(it,p)){
    items=items.filter(i=>i!==it);world.querySelector(`[data-iid="${it.id}"]`)?.remove();undoStack.push({it:{...it}});hit=true;}
  if(hit){if(undoStack.length>50)undoStack.shift();renderAll();}}

// 클라우드: 이미지 파일은 assets에 올리고 항목에는 그 id(asset)만 저장
async function uploadImage(it,f,url){
  if(!cloud.assets){note("이 기기에서는 이미지를 올릴 수 없어요. 이 화면에만 보여요.");return;}
  try{const blob=/^image\/(png|jpeg|gif|webp)$/.test(f.type)?f:await toPng(url);
    const r=await cloud.assets.upload(blob);it.asset=r.id;saveMeta();}
  catch(e){note(e&&e.code==="too_large"?"이미지가 너무 커요 (20MB까지). 이 화면에만 보여요.":"이미지를 올리지 못했어요. 이 화면에만 보여요.");}}
// 삭제 · 되돌리기(⌘Z / Ctrl+Z)
const undoStack=[];// {it,blob}
async function delSel(){if(!selId)return;const id=selId,it=items.find(i=>i.id===id);if(!it)return;
  items=items.filter(i=>i.id!==id);selId=null;
  world.querySelector(`[data-iid="${id}"]`)?.remove();renderAll();saveMeta();
  if(it.type||cloud.db){undoStack.push({it:{...it}});}
  else{const blob=await fetch(urls[id]).then(r=>r.blob()).catch(()=>null);
    URL.revokeObjectURL(urls[id]);delete urls[id];
    if(blob)undoStack.push({it:{...it},blob});
    idb("blobs","readwrite",s=>s.delete(id));}
  if(undoStack.length>50)undoStack.shift();}
async function undoDel(){const u=undoStack.pop();if(!u)return;
  if(u.added){const it=items.find(i=>i.id===u.added);if(it){items=items.filter(i=>i!==it);world.querySelector(`[data-iid="${it.id}"]`)?.remove();if(selId===it.id)selId=null;renderAll();saveMeta();}return;}// 방금 그린 선 지우기
  const it=u.it;it.z=it.type==="rect"?backZ():++topZ;
  if(u.blob){urls[it.id]=URL.createObjectURL(u.blob);await idb("blobs","readwrite",s=>s.put(u.blob,it.id));}
  else if(!it.type&&it.asset&&!urls[it.id])setAssetUrl(it.id,it.asset);
  items.push(it);select(it.id);saveMeta();}

// 붙여넣기: 이미지가 있으면 보드에 추가
document.addEventListener("paste",ev=>{
  if(readOnly&&!isTyping(ev.target))return;
  const typing=isTyping(ev.target),at=lastPt?boardPoint(lastPt.x,lastPt.y):null;
  if(!typing&&!board.offsetWidth)return;// 보드가 안 보이는 화면(위치·메모)에서는 무시
  const files=[...(ev.clipboardData?.items||[])].filter(i=>i.kind==="file"&&i.type.startsWith("image/")).map(i=>i.getAsFile()).filter(Boolean);
  const text=(ev.clipboardData?.getData("text/plain")||"").replace(/\s+$/,"");
  // 방금 보드에서 복사한 것이면 그대로 복제
  if(!typing&&clip&&(text===clip.tag||(clip.it.type==="text"&&text===clip.it.text)||(!clip.it.type&&files.length&&!text))){ev.preventDefault();pasteClip(at);return;}
  if(files.length){ev.preventDefault();addFiles(files,at);return;}
  // 글자만 있으면 보드에 글자로 추가 (메모·글자 편집 중에는 원래대로 붙여넣기)
  if(typing||!text||text.startsWith("\u2063board-item:"))return;ev.preventDefault();
  const r=board.getBoundingClientRect();
  addText(at||boardPoint(r.left+r.width/2,r.top+r.height/2),text);
});
// 글자 편집 중에는 붙여넣기도 서식 없는 글자로
world.addEventListener("paste",ev=>{if(!isTyping(ev.target))return;ev.preventDefault();ev.stopPropagation();
  document.execCommand("insertText",false,ev.clipboardData?.getData("text/plain")||"");});
// 더블클릭: 빈 곳 → 새 글자, 글자 → 편집
// 드래그용 포인터 캡처 때문에 ev.target이 보드로 잡히므로 실제 커서 아래 요소로 판단
function onDouble(x,y){if(readOnly||penOn||eraserOn)return;closeCellPop();
  const t=document.elementFromPoint(x,y);if(!t||!board.contains(t))return;
  if(isTyping(t)||t.closest(".tools")||t.closest(".note")||t.closest(".pop")||["rot","h","del"].some(c=>t.classList.contains(c)))return;
  const itEl=t.closest(".item");
  if(itEl){const it=items.find(i=>i.id===itEl.dataset.iid);if(it&&EDITABLE.includes(it.type))startEdit(it,true);return;}
  addText(boardPoint(x,y));}
let touchDbl=0;// 터치 두 번 탭을 직접 처리했으면 뒤따르는 dblclick은 무시
board.addEventListener("dblclick",ev=>{if(Date.now()-touchDbl<700)return;onDouble(ev.clientX,ev.clientY);});
// 끌어다 놓기
board.addEventListener("dragover",ev=>{ev.preventDefault();board.classList.add("drop")});
board.addEventListener("dragleave",ev=>{if(ev.target===board)board.classList.remove("drop")});
board.addEventListener("drop",ev=>{ev.preventDefault();board.classList.remove("drop");if(readOnly)return;
  addFiles(ev.dataTransfer.files,boardPoint(ev.clientX,ev.clientY))});

// 이동 · 크기 조절 · 화면 이동
let act=null;const bp=new Map();let pinch=null;
board.addEventListener("pointerdown",ev=>{
  if(ev.target.closest(".tools")||ev.target.closest(".note")||ev.target.closest(".pop")||isTyping(ev.target))return;
  closeCellPop();
  bp.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  tap=bp.size===1?{x:ev.clientX,y:ev.clientY,t:Date.now()}:null;
  if(bp.size===2){const [a,b]=[...bp.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};act=null;penEnd(true);erasing=false;return;}
  stopEditing();board.focus({preventScroll:true});
  if(penOn){penStart(ev);board.setPointerCapture(ev.pointerId);return;}
  if(eraserOn){erasing=true;eraseAt(ev);board.setPointerCapture(ev.pointerId);return;}
  const itEl=readOnly?null:ev.target.closest(".item");
  if(itEl&&group.has(itEl.dataset.iid)){// 여러 개 고른 상태에서 그중 하나를 끌면 함께 옮김
    act={type:"gmove",sx:ev.clientX,sy:ev.clientY,orig:items.filter(i=>group.has(i.id)).map(o=>[o,o.x,o.y])};
    board.setPointerCapture(ev.pointerId);return;}
  if(itEl){const it=items.find(i=>i.id===itEl.dataset.iid);select(it.id);
    if(ev.target.classList.contains("rot")){rotate(it,90);bp.delete(ev.pointerId);return;}
    if(ev.target.classList.contains("del")){delSel();bp.delete(ev.pointerId);return;}
    act={type:ev.target.classList.contains("h")?"resize":"move",it,sx:ev.clientX,sy:ev.clientY,ox:it.x,oy:it.y,ow:it.w,oh:it.h,ofs:it.fs};}
  else if(!sheet&&!readOnly&&ev.pointerType!=="touch"&&ev.button===0&&!spaceDown){select(null);// 프리폼: 범위 선택
    act={type:"marq",sx:ev.clientX,sy:ev.clientY};drawMarq(ev);marqEl.hidden=false;}
  else{select(null);act={type:"pan",sx:ev.clientX,sy:ev.clientY,ox:cam.x,oy:cam.y};board.classList.add("panning");}
  board.setPointerCapture(ev.pointerId);
});
board.addEventListener("pointermove",ev=>{
  if(!bp.has(ev.pointerId))return;bp.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pinch&&bp.size===2){const [a,b]=[...bp.values()],d=Math.hypot(a.x-b.x,a.y-b.y);zoomBoard(d/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2);pinch.d=d;return;}
  if(stroke){penMove(ev);return;}
  if(erasing){eraseAt(ev);return;}
  if(!act)return;let dx=ev.clientX-act.sx,dy=ev.clientY-act.sy;
  if(act.type==="marq"){drawMarq(ev);return;}
  if(act.type==="gmove"){for(const [o,ox,oy] of act.orig){o.x=ox+dx/cam.z;o.y=oy+dy/cam.z;render(o);}return;}
  if(act.type==="resize"&&act.it.rot){const a=act.it.rot*Math.PI/180,c=Math.cos(a),s=Math.sin(a);[dx,dy]=[dx*c+dy*s,-dx*s+dy*c];}
  if(act.type==="pan"){cam.x=act.ox+dx;cam.y=act.oy+dy;applyCam();}
  else if(act.type==="move"){act.it.x=act.ox+dx/cam.z;act.it.y=act.oy+dy/cam.z;snapMove(act.it);render(act.it);}
  else if(act.it.type==="text"){act.it.fs=Math.max(6,act.ofs*Math.max(.05,(act.ow+dx/cam.z)/act.ow));render(act.it);snapResize(act.it);}
  else if(act.it.type==="arrow"||act.it.type==="rect"||act.it.type==="tbox"||act.it.type==="sym"||act.it.type==="frame"){act.it.w=Math.max(act.it.type==="sym"?4:20,act.ow+dx/cam.z);act.it.h=Math.max(act.it.type==="sym"?4:8,act.oh+dy/cam.z);render(act.it);snapResize(act.it);}
  else{const ratio=act.oh/act.ow;let w=Math.max(30,act.ow+dx/cam.z);
    act.it.w=w;act.it.h=ev.shiftKey?Math.max(30,act.oh+dy/cam.z):w*ratio;render(act.it);snapResize(act.it,ev.shiftKey?0:ratio);}
});
// 정렬 가이드: 항목의 왼쪽·오른쪽 / 위·아래 끝이 다른 항목의 같은 쪽 끝과 가까우면 맞붙이고 선 표시
const guide=document.createElement("div"),hGuide=document.createElement("div");
guide.className=hGuide.className="guide";guide.hidden=hGuide.hidden=true;world.append(guide,hGuide);
const edgeOf=(b,e)=>e==="left"?b.x:e==="right"?b.x+b.w:e==="top"?b.y:b.y+b.h;
// me의 edges 중 다른 항목의 같은 쪽 끝과 가장 가까운 것 {d,edge,at,shift}
function nearest(it,edges){const tol=6/cam.z,me=vbox(it);let best=null;
  for(const o of vis()){if(o===it)continue;const ob=vbox(o);
    for(const e of edges){const at=edgeOf(ob,e),d=Math.abs(at-edgeOf(me,e));if(d<=tol&&(!best||d<best.d))best={d,edge:e,at,shift:at-edgeOf(me,e)};}}
  return best;}
function showGuides(v,h){const pad=12/cam.z,lw=1.5/cam.z,B=vis().map(vbox);
  if(v){const same=B.filter(b=>Math.abs(edgeOf(b,v.edge)-v.at)<0.01),y0=Math.min(...same.map(b=>b.y)),y1=Math.max(...same.map(b=>b.y+b.h));
    Object.assign(guide.style,{left:(v.at-lw/2)+"px",top:(y0-pad)+"px",width:lw+"px",height:(y1-y0+pad*2)+"px"});}
  if(h){const same=B.filter(b=>Math.abs(edgeOf(b,h.edge)-h.at)<0.01),x0=Math.min(...same.map(b=>b.x)),x1=Math.max(...same.map(b=>b.x+b.w));
    Object.assign(hGuide.style,{left:(x0-pad)+"px",top:(h.at-lw/2)+"px",width:(x1-x0+pad*2)+"px",height:lw+"px"});}
  guide.hidden=!v;hGuide.hidden=!h;}
// 이동 중: 위치를 옮겨 맞춤
function snapMove(it){const v=nearest(it,["left","right"]);if(v)it.x+=v.shift;
  const h=nearest(it,["top","bottom"]);if(h)it.y+=h.shift;showGuides(v,h);}
// 크기 조절 중: 움직이는 오른쪽·아래 끝을 맞춤 (비율 고정이면 더 가까운 한쪽만)
function snapResize(it,ratio){
  if((it.rot||0)%180){showGuides(null,null);return;}
  let v=nearest(it,["right"]),h=nearest(it,["bottom"]);
  if(it.type==="text"){const k=v&&(!h||v.d<=h.d)?(it.w+v.shift)/it.w:h?(it.h+h.shift)/it.h:1;
    if(v&&h){if(v.d<=h.d)h=null;else v=null;}
    if(k!==1){it.fs*=k;render(it);}}
  else if(ratio){if(v&&h){if(v.d<=h.d)h=null;else v=null;}
    if(v){it.w+=v.shift;it.h=it.w*ratio;}else if(h){it.h+=h.shift;it.w=it.h/ratio;}}
  else{if(v)it.w+=v.shift;if(h)it.h+=h.shift;}
  render(it);showGuides(v,h);}
// 범위 선택 상자 (화면 좌표) → 놓으면 상자에 걸친 항목을 모두 고름
const marqEl=document.getElementById("marq");let spaceDown=false;
function drawMarq(ev){const r=board.getBoundingClientRect(),x0=Math.min(act.sx,ev.clientX),y0=Math.min(act.sy,ev.clientY);
  Object.assign(marqEl.style,{left:x0-r.left+"px",top:y0-r.top+"px",width:Math.abs(ev.clientX-act.sx)+"px",height:Math.abs(ev.clientY-act.sy)+"px"});}
function endMarq(ev){marqEl.hidden=true;
  if(Math.hypot(ev.clientX-act.sx,ev.clientY-act.sy)<4)return;// 그냥 누른 것
  const a=boardPoint(Math.min(act.sx,ev.clientX),Math.min(act.sy,ev.clientY)),b=boardPoint(Math.max(act.sx,ev.clientX),Math.max(act.sy,ev.clientY));
  const hit=vis().filter(it=>{const v=vbox(it);return v.x<b.x&&a.x<v.x+v.w&&v.y<b.y&&a.y<v.y+v.h;}).map(i=>i.id);
  if(hit.length===1)select(hit[0]);else if(hit.length>1){select(null);group=new Set(hit);renderAll();}}
async function delGroup(){const ids=[...group];group.clear();for(const id of ids){selId=id;await delSel();}renderAll();}
// 스페이스를 누른 채 끌면 화면 이동
document.addEventListener("keydown",ev=>{if(ev.code==="Space"&&!isTyping(ev.target)&&board.offsetWidth){if(!spaceDown){spaceDown=true;board.classList.add("space");}if(ev.target===board)ev.preventDefault();}});
document.addEventListener("keyup",ev=>{if(ev.code==="Space"){spaceDown=false;board.classList.remove("space");}});
window.addEventListener("blur",()=>{spaceDown=false;board.classList.remove("space");});
let tap=null,lastTap=null;
function endPtr(ev){bp.delete(ev.pointerId);if(bp.size<2)pinch=null;guide.hidden=hGuide.hidden=true;
  if(stroke){penEnd(ev.type==="pointercancel");tap=null;return;}
  if(erasing){erasing=false;tap=null;saveMeta();return;}
  if(act&&act.type==="marq")endMarq(ev);
  const wasPan=act&&act.type==="pan";
  if(act){saveMeta();act=null;board.classList.remove("panning");}
  // 설계도: 빈 곳(모눈종이 칸)을 짧게 누르면 칸 색 고르기
  if(wasPan&&sheet==="plan"&&!readOnly&&ev.type==="pointerup"&&tap&&Date.now()-tap.t<400&&Math.hypot(ev.clientX-tap.x,ev.clientY-tap.y)<6)
    openCellPop(ev.clientX,ev.clientY);
  // 터치: 짧게 두 번 탭 = 더블클릭
  if(ev.type==="pointerup"&&ev.pointerType!=="mouse"&&tap&&Date.now()-tap.t<300&&Math.hypot(ev.clientX-tap.x,ev.clientY-tap.y)<10){
    if(lastTap&&Date.now()-lastTap.t<400&&Math.hypot(ev.clientX-lastTap.x,ev.clientY-lastTap.y)<30){lastTap=null;touchDbl=Date.now();onDouble(ev.clientX,ev.clientY);}
    else lastTap={x:ev.clientX,y:ev.clientY,t:Date.now()};}
  tap=null;}
board.addEventListener("pointerup",endPtr);board.addEventListener("pointercancel",endPtr);

function zoomBoard(f,cx,cy){const r=board.getBoundingClientRect(),nz=Math.min(8,Math.max(0.05,cam.z*f)),k=nz/cam.z;
  const px=cx-r.left,py=cy-r.top;cam.x=px-(px-cam.x)*k;cam.y=py-(py-cam.y)*k;cam.z=nz;applyCam();saveMeta();}
board.addEventListener("wheel",ev=>{ev.preventDefault();
  if(ev.ctrlKey||ev.metaKey)zoomBoard(Math.exp(-ev.deltaY*0.01),ev.clientX,ev.clientY);
  else{cam.x-=ev.deltaX;cam.y-=ev.deltaY;applyCam();saveMeta();}},{passive:false});
function fit(){const r=board.getBoundingClientRect();
  const B=vis().map(vbox);if(sheet==="plan")B.push(PAPER_BOX);// 설계도는 모눈종이까지 다 보이게
  if(!B.length){cam={x:40,y:60,z:1};applyCam();saveMeta();return;}
  const x0=Math.min(...B.map(i=>i.x)),y0=Math.min(...B.map(i=>i.y)),x1=Math.max(...B.map(i=>i.x+i.w)),y1=Math.max(...B.map(i=>i.y+i.h));
  const pad=60,z=Math.min(4,(r.width-pad*2)/(x1-x0),(r.height-pad*2-40)/(y1-y0));
  cam={z,x:(r.width-(x1-x0)*z)/2-x0*z,y:40+(r.height-40-(y1-y0)*z)/2-y0*z};applyCam();saveMeta();}
document.getElementById("fitBtn").onclick=fit;
// 모눈종이: 100평 정사각형 = 한 변 200/11 ≈ 18.18 m, 10×10칸이라 한 칸 ≈ 1.82 m. 보드 좌표로 한 칸 100 (종이 0~1000)
const PAPER=1000,CELL=PAPER/10,SIDE_M=200/11,GAP=40,PAPER_BOX={x:-190,y:-190,w:PAPER+230,h:PAPER+230};// GAP: 종이와 치수선 사이를 더 띄움
const paperEl=(()=>{const m=-210,size=PAPER-m+40,svgEl=document.createElementNS(NS,"svg");
  svgEl.setAttribute("class","paper");svgEl.setAttribute("viewBox",`${m} ${m} ${size} ${size}`);
  Object.assign(svgEl.style,{left:m+"px",top:m+"px",width:size+"px",height:size+"px"});
  const f=v=>v.toFixed(2);let g="",dl="",tx="";
  for(let i=1;i<10;i++)g+=`M${i*CELL} 0V${PAPER}M0 ${i*CELL}H${PAPER}`;
  // 칸 치수 (위·왼쪽) — 눈금 + 칸마다 1.82
  const o=v=>-(v+GAP);// 종이 바깥쪽 거리 v → 좌표
  dl+=`M0 ${o(40)}H${PAPER}M${o(40)} 0V${PAPER}`;
  for(let i=0;i<=10;i++){const v=i*CELL;dl+=`M${v} ${o(50)}V${o(30)}M${o(50)} ${v}H${o(30)}`;}
  for(let i=0;i<10;i++){const c=i*CELL+CELL/2;
    tx+=`<text class="t1" x="${c}" y="${o(50)}">${f(SIDE_M/10)}</text><text class="t1" transform="translate(${o(50)} ${c}) rotate(-90)">${f(SIDE_M/10)}</text>`;}
  // 전체 치수
  dl+=`M0 ${o(110)}H${PAPER}M0 ${o(122)}V${o(98)}M${PAPER} ${o(122)}V${o(98)}M${o(110)} 0V${PAPER}M${o(122)} 0H${o(98)}M${o(122)} ${PAPER}H${o(98)}`;
  const all=`${f(SIDE_M)} m · 100평 (330.6㎡)`;
  tx+=`<text class="t2" x="${PAPER/2}" y="${o(122)}">${all}</text><text class="t2" transform="translate(${o(122)} ${PAPER/2}) rotate(-90)">${all}</text>`;
  svgEl.innerHTML=`<rect class="sheet" width="${PAPER}" height="${PAPER}"/><g class="cells"></g><path class="g" d="${g}"/><rect class="b" width="${PAPER}" height="${PAPER}"/><path class="dl" d="${dl}"/>${tx}`;
  svgEl.setAttribute("hidden","");world.prepend(svgEl);return svgEl;})();
// 칸 색: 칸을 짧게 누르면 색 고르기. {"행,열": 색 이름} — 클라우드는 app/plan, 아니면 이 기기에
let cells={};try{cells=JSON.parse(localStorage.getItem("kr-plan-cells")||"{}")||{}}catch(e){}
const cellG=paperEl.querySelector(".cells"),cellPop=document.getElementById("cellPop"),cellOpts=document.getElementById("cellOpts");
function drawCells(){if(typeof mark3D==="function")mark3D();cellG.innerHTML=Object.entries(cells).map(([k,v])=>{const col=RECT_COLORS.find(c=>c[0]===v),[r,c]=k.split(",").map(Number);
  return col?`<rect x="${c*CELL}" y="${r*CELL}" width="${CELL}" height="${CELL}" fill="${col[2]}"/>`:"";}).join("");}
function saveCells(){if(cloud.db)put("app/plan",{cells});else try{localStorage.setItem("kr-plan-cells",JSON.stringify(cells))}catch(e){}}
let cellCur=null;
[...RECT_COLORS.filter(c=>c[0]!=="black"),["none","지우기","transparent"]].forEach(([k,n,c])=>{const b=document.createElement("button");b.type="button";b.dataset.c=k;
  b.innerHTML=`<span class="sw" style="--c:${c}"></span>${n}`;
  b.onclick=()=>{if(!cellCur)return;if(k==="none")delete cells[cellCur];else cells[cellCur]=k;drawCells();saveCells();closeCellPop();board.focus({preventScroll:true});};
  cellOpts.append(b);});
function openCellPop(cx,cy){const p=boardPoint(cx,cy),c=Math.floor(p.x/CELL),r=Math.floor(p.y/CELL);
  if(c<0||r<0||c>9||r>9)return false;cellCur=r+","+c;
  document.getElementById("cellName").textContent=`칸 ${r+1}행 ${c+1}열`;
  cellOpts.querySelectorAll("button").forEach(b=>b.setAttribute("aria-current",(cells[cellCur]||"none")===b.dataset.c));
  cellPop.hidden=false;const br=board.getBoundingClientRect(),pw=cellPop.offsetWidth,ph=cellPop.offsetHeight;
  let x=cx-br.left+14,y=cy-br.top+14;if(x+pw>br.width-8)x=Math.max(8,cx-br.left-pw-14);if(y+ph>br.height-8)y=Math.max(8,cy-br.top-ph-14);

  walk.pitch=-.05;T3.cam.fov=70;T3.cam.updateProjectionMatrix();T3.cam.position.copy(p);T3.ctl.enabled=false;
  // 방 조명: 천장 가운데 은은한 불 (그림자 없음) — 지붕·천장에 가려 어두운 실내를 밝힘
  if(!T3.roomLight){T3.roomLight=new THREE.PointLight(0xFFF4E2,.55,9,1.2);T3.scene.add(T3.roomLight);}
  T3.roomLight.visible=!room.out;T3.roomLight.position.set(room.x,Math.max(1.8,T3.wallH-.25),room.z);
  T3.cam.rotation.set(walk.pitch,walk.yaw,0,"YXZ");walk.last=performance.now();
  (T3.labelSprites||[]).forEach(s=>s.visible=false);if(T3.compass)T3.compass.visible=false;document.querySelector(".three").classList.add("walking");
  document.getElementById("walkHud").hidden=false;walk.name=room.name;walkLabel(EYE);}
function walkLabel(y){document.getElementById("walkName").textContent=`${walk.name} · 눈높이 ${y.toFixed(2)} m`;}
// 걷는 동안은 천장을 보이게 (평소엔 그림자만 드리우는 보이지 않는 천장)
const CEIL_MAT=()=>T3.ceilMat||(T3.ceilMat=Object.assign(new THREE.MeshStandardMaterial({color:"#F3F1EC",side:THREE.DoubleSide,roughness:.95}),{userData:{keep:1}}));
function showCeil(on){for(const o of T3.ceils||[]){if(on){if(!o.userData.inv)o.userData.inv=o.material;o.material=CEIL_MAT();o.receiveShadow=true;}else if(o.userData.inv)o.material=o.userData.inv;}}
function exitWalk(){if(!T3.walk)return;T3.walk=false;showCeil(false);if(T3.roomLight)T3.roomLight.visible=false;
  if(T3.walkRoof){T3.walkRoof=false;T3.roof=false;build3D();}T3.cam.fov=45;T3.cam.updateProjectionMatrix();T3.ctl.enabled=true;
  (T3.labelSprites||[]).forEach(s=>s.visible=true);if(T3.compass)T3.compass.visible=true;document.querySelector(".three").classList.remove("walking");document.getElementById("walkHud").hidden=true;view3D("tilt");}
function walkMove(fwd,side){const f=new THREE.Vector3(-Math.sin(walk.yaw),0,-Math.cos(walk.yaw)),r=new THREE.Vector3(Math.cos(walk.yaw),0,-Math.sin(walk.yaw));
  const v=f.multiplyScalar(fwd).add(r.multiplyScalar(side)),d=v.length();if(d<1e-4)return;v.normalize();
  if(walkFree(T3.cam.position,v,d))T3.cam.position.addScaledVector(v,d);}
function walkStep(){const now=performance.now(),dt=Math.min(.1,(now-walk.last)/1000);walk.last=now;const k=walk.keys,sp=(k.ShiftLeft?3.5:1.4)*dt;// 왼쪽 Shift = 뛰기
  const fwd=((k.KeyW||k.ArrowUp)?1:0)-((k.KeyS||k.ArrowDown)?1:0)+walk.hold,side=((k.KeyD||k.ArrowRight)?1:0)-((k.KeyA||k.ArrowLeft)?1:0);
  if(fwd||side)walkMove(fwd*sp,side*sp);
  const up=(k.Space?1:0)-(k.Tab?1:0);// Space 위로 · Tab 아래로 (바닥 0.3 m ~ 40 m)
  if(up){const y=T3.cam.position.y=Math.max(.3,Math.min(40,T3.cam.position.y+up*sp));walkLabel(y);}
  T3.cam.rotation.set(walk.pitch,walk.yaw,0,"YXZ");}
{const view=document.getElementById("threeView");let dn=null;
  view.addEventListener("pointerdown",ev=>{dn={x:ev.clientX,y:ev.clientY,t:Date.now(),lx:ev.clientX,ly:ev.clientY};if(T3.walk)view.setPointerCapture(ev.pointerId);});
  view.addEventListener("pointermove",ev=>{if(!T3.walk||!dn)return;walk.yaw+=(ev.clientX-dn.lx)*.004;walk.pitch=Math.max(-1.3,Math.min(1.3,walk.pitch+(ev.clientY-dn.ly)*.004));dn.lx=ev.clientX;dn.ly=ev.clientY;});
  view.addEventListener("pointerup",ev=>{const d=dn;dn=null;if(!d||T3.walk||!T3.ready)return;
    if(Math.hypot(ev.clientX-d.x,ev.clientY-d.y)>6||Date.now()-d.t>500)return;// 끌기는 화면 돌리기 — 짧게 누른 것만
    const r=view.getBoundingClientRect(),m=new THREE.Vector2((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1),rc=ray3();rc.far=500;
    rc.setFromCamera(m,T3.cam);const h=rc.intersectObjects([...(T3.labels&&T3.labelSprites||[]),...(T3.compass?.children||[])],false)[0];if(!h)return;
    const k=h.object.userData.k;if(!k)return enterRoom(h.object.userData.room);
    // 방위 글자: 그쪽 바깥에 서서 집 가운데를 바라봄
    const C=SIDE_M/2,{x,z}=h.object.position;enterRoom({name:{N:"북",E:"동",S:"남",W:"서"}[k]+"쪽 바깥",x,z,out:true,yaw:Math.atan2(x-C,z-C)});});
  view.addEventListener("wheel",ev=>{if(!T3.walk)return;ev.preventDefault();walkMove(-Math.sign(ev.deltaY)*.4,0);},{passive:false});
  document.addEventListener("keydown",ev=>{if(!T3.walk||isTyping(ev.target))return;if(ev.key==="Escape"){exitWalk();return;}
    if(/^(Key[WASD]|Arrow(Up|Down|Left|Right))$/.test(ev.code)){walk.keys[ev.code]=true;ev.preventDefault();}
    if(ev.code==="ShiftLeft")walk.keys.ShiftLeft=true;
    if(ev.code==="Space"||ev.code==="Tab"){walk.keys[ev.code]=true;ev.preventDefault();}});
  document.addEventListener("keyup",ev=>{walk.keys[ev.code]=false;});
  window.addEventListener("blur",()=>{walk.keys={};walk.hold=0;});
  document.getElementById("walkExit").onclick=exitWalk;
  document.querySelectorAll("[data-walk]").forEach(b=>{const v=+b.dataset.walk;
    b.addEventListener("pointerdown",ev=>{ev.preventDefault();walk.hold=v;});for(const e of ["pointerup","pointerleave","pointercancel"])b.addEventListener(e,()=>walk.hold=0);});}
// ===== 해: 날짜·시각 → 해 높이·방위 (위도 37°, 경도 127.5° — 한국 표준시 기준) =====
const LAT=37*Math.PI/180,LON=127.5;
const SEASON={80:"춘분",172:"하지",266:"추분",355:"동지"};
function doyLabel(n){const d=new Date(2026,0,n);let t=`${d.getMonth()+1}월 ${d.getDate()}일`;
  for(const [k,v] of Object.entries(SEASON))if(Math.abs(n-k)<=3)t+=` · ${v}`;return t;}
function timeLabel(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60);return `${hh<12?"오전":"오후"} ${((hh+11)%12)+1}:${String(mm).padStart(2,"0")}`;}
// 해의 방향 (단위 벡터, 월드 좌표) — 북쪽이 설계도의 위(-z)일 때 동쪽은 +x. north: 설계도에서 북쪽이 시계 방향으로 몇 도
function sunAt(doy,clock,north){const decl=23.44*Math.PI/180*Math.sin(2*Math.PI*(284+doy)/365);
  const B=2*Math.PI*(doy-81)/364,eot=(9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B))/60;// 균시차(시간)
  const solar=clock+(LON-135)/15+eot,h=(solar-12)*15*Math.PI/180;
  const el=Math.asin(Math.sin(LAT)*Math.sin(decl)+Math.cos(LAT)*Math.cos(decl)*Math.cos(h));
  const az=Math.atan2(-Math.cos(decl)*Math.sin(h),Math.sin(decl)*Math.cos(LAT)-Math.cos(decl)*Math.sin(LAT)*Math.cos(h));// 북에서 동쪽으로
  const n=north*Math.PI/180,N=[Math.sin(n),-Math.cos(n)],E=[Math.cos(n),Math.sin(n)];
  const ce=Math.cos(el),dx=(E[0]*Math.sin(az)+N[0]*Math.cos(az))*ce,dz=(E[1]*Math.sin(az)+N[1]*Math.cos(az))*ce;
  return{el,az,dir:new THREE.Vector3(dx,Math.sin(el),dz)};}
const sunDay=document.getElementById("sunDay"),sunTime=document.getElementById("sunTime"),sunNorth=document.getElementById("sunNorth");
{const now=new Date(),d0=new Date(now.getFullYear(),0,0);sunDay.value=Math.min(365,Math.floor((now-d0)/864e5));}
// 북쪽: 자동이면 정문(앞마당·대문) 쪽을 정북으로
const northDeg=()=>sunNorth.value==="auto"?{top:0,right:90,bottom:180,left:270}[T3.front||"top"]:+sunNorth.value;
const ray3=()=>T3.ray||(T3.ray=new THREE.Raycaster());
// 점들 중 해가 직접 비치는 비율 (해가 지평선 아래면 0)
// (방금 만든 벽도 제자리에서 맞도록 먼저 위치 갱신)
function litShare(pts,dir){if(dir.y<=.01||!pts.length)return 0;T3.root.updateMatrixWorld(true);const rc=ray3(),o=new THREE.Vector3();let lit=0;rc.far=60;
  for(const [x,z] of pts){o.set(x,.4,z);rc.set(o,dir);if(!rc.intersectObjects(T3.blockers,false).length)lit++;}return lit/pts.length;}
function sunUpdate(rebuilt){if(!T3.ready||!T3.sun)return;
  const doy=+sunDay.value,clock=+sunTime.value,north=northDeg(),{el,az,dir}=sunAt(doy,clock,north),C=SIDE_M/2;
  document.getElementById("sunDayV").textContent=doyLabel(doy);document.getElementById("sunTimeV").textContent=timeLabel(clock);
  const up=el>0,s=Math.max(0,Math.sin(el));
  T3.sun.position.set(C+dir.x*40,dir.y*40,C+dir.z*40);T3.sun.target.position.set(C,0,C);
  T3.sun.intensity=up?.3+.3*Math.min(1,s*1.8):0;T3.sun.color.set(s<.25?"#FFD2A1":"#FFFFFF");// 낮은 해는 노을빛
  T3.hemi.intensity=up?.42+.15*Math.min(1,s*2):.25;
  T3.scene.background.set(up?(s<.2?"#E9CDB0":"#DDE2E0"):"#5D6678");
  if(!T3.compass){T3.compass=new THREE.Group();T3.scene.add(T3.compass);
    for(const [t,col] of [["N","#C62828"],["E","#1D2524"],["S","#1D2524"],["W","#1D2524"]]){const cv=document.createElement("canvas");cv.width=cv.height=128;const x=cv.getContext("2d");
      x.fillStyle="rgba(255,255,255,.9)";x.beginPath();x.arc(64,64,58,0,7);x.fill();x.lineWidth=5;x.strokeStyle=col;x.stroke();
      x.fillStyle=col;x.font="800 72px system-ui,sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(t,64,68);
      const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv)}));sp.scale.set(1.8,1.8,1);sp.userData.k=t;T3.compass.add(sp);}}
  {const n=north*Math.PI/180,R=C+13;for(const sp of T3.compass.children){const a=n+{N:0,E:Math.PI/2,S:Math.PI,W:-Math.PI/2}[sp.userData.k];
    sp.position.set(C+Math.sin(a)*R,1.2,C-Math.cos(a)*R);}}
  T3.sunBall.position.set(C+dir.x*34,Math.max(.5,dir.y*34),C+dir.z*34);
  const pts=[];for(let t=4;t<=20.01;t+=.25){const q=sunAt(doy,t,north);if(q.el>0)pts.push(new THREE.Vector3(C+q.dir.x*34,q.dir.y*34,C+q.dir.z*34));}
  T3.sunPath.geometry.dispose();T3.sunPath.geometry=new THREE.BufferGeometry().setFromPoints(pts);T3.sunPath.computeLineDistances();
  const deg=v=>Math.round(v*180/Math.PI),dirName=["북","북동","동","남동","남","남서","서","북서"][Math.round(((deg(az)%360)+360)%360/45)%8];
  document.getElementById("sunState").textContent=up?`해 높이 ${deg(el)}° · ${dirName}쪽 (방위 ${((deg(az)%360)+360)%360}°)`:"해가 졌어요 — 시각을 낮으로 옮겨 보세요";
  // 방별: 지금 햇빛 비율 + 하루 일조 시간 (하루치는 날짜·북쪽·설계도가 바뀔 때만 다시)
  const rooms=T3.rooms||[];for(const r of rooms)r.now=litShare(r.pts,dir);
  const key=doy+"|"+north;if(rebuilt||T3.dayKey!==key){T3.dayKey=key;dailySun(doy,north);}
  drawSunPanel();}
function dailySun(doy,north){const job=T3.dayJob=(T3.dayJob||0)+1,rooms=T3.rooms||[];rooms.forEach(r=>r.hrs=null);
  const times=[];for(let t=5;t<=20;t+=.5)times.push(t);let k=0;
  const stepFn=()=>{if(job!==T3.dayJob)return;const t=times[k++];if(t===undefined){drawSunPanel();return;}
    const {dir}=sunAt(doy,t,north);for(const r of rooms)r.acc=(k===1?0:r.acc||0)+litShare(r.pts,dir)*.5;
    if(k===times.length)rooms.forEach(r=>r.hrs=r.acc);setTimeout(stepFn,0);};
  rooms.forEach(r=>r.acc=0);stepFn();}
function drawSunPanel(){const box=document.getElementById("sunRooms"),rooms=T3.rooms||[];
  if(!T3.walls||!(T3.wallH>0)){box.innerHTML='<div class="hrs">벽을 켜야 방별 햇빛을 잴 수 있어요.</div>';return;}
  if(!rooms.length){box.innerHTML='<div class="hrs">설계도에 방 이름(텍스트)을 넣으면 방마다 햇빛을 보여줘요.</div>';return;}
  box.innerHTML=rooms.map(r=>`<div class="row"><span>${esc(r.name)}</span><span class="hrs">지금 ${Math.round((r.now||0)*100)}% · 하루 ${r.hrs==null?"…":r.hrs.toFixed(1)+"시간"}</span><div class="bar"><i style="width:${Math.round((r.now||0)*100)}%"></i></div></div>`).join("");}
for(const el of [sunDay,sunTime])el.addEventListener("input",()=>sunUpdate());sunNorth.addEventListener("change",()=>sunUpdate());
const sunPlay=document.getElementById("sunPlay");
sunPlay.onclick=()=>{if(T3.playT){clearInterval(T3.playT);T3.playT=null;sunPlay.setAttribute("aria-pressed","false");sunPlay.textContent="▶ 하루";return;}
  sunPlay.setAttribute("aria-pressed","true");sunPlay.textContent="❚❚ 멈춤";
  T3.playT=setInterval(()=>{let v=+sunTime.value+.25;if(v>20)v=5;sunTime.value=v;sunUpdate();},150);};
document.getElementById("sunBtn").onclick=ev=>{const bar=document.getElementById("sunBar"),open=bar.hidden;// 일조량: 누르면 날짜·시각 막대와 방별 햇빛 표를 펼침
  bar.hidden=!open;document.getElementById("sunPanel").hidden=!open;ev.currentTarget.setAttribute("aria-expanded",open);sunUpdate();};
document.querySelectorAll("[data-v3]").forEach(b=>b.onclick=()=>T3.ready&&view3D(b.dataset.v3));
for(const [id,key] of [["wallsBtn","walls"],["labelsBtn","labels"],["roofBtn","roof"]])
  document.getElementById(id).onclick=ev=>{T3[key]=!T3[key];ev.currentTarget.setAttribute("aria-pressed",T3[key]);build3D();};
const wallHIn=document.getElementById("wallH");
if(layout.dataset.view==="three"||document.querySelector(".three.on"))show3D(true);// 3D 탭을 열어 둔 채 다시 들어온 경우
const fenceIn=document.getElementById("fenceH");
fenceIn.oninput=()=>{T3.fenceH=+fenceIn.value;document.getElementById("fenceHv").textContent=T3.fenceH?T3.fenceH.toFixed(1)+" m":"없음";clearTimeout(T3.ft);T3.ft=setTimeout(build3D,120);};
wallHIn.oninput=()=>{T3.wallH=+wallHIn.value;document.getElementById("wallHv").textContent=T3.wallH.toFixed(1)+" m";clearTimeout(T3.ht);T3.ht=setTimeout(build3D,120);};

// ===== 옮기기: 컴퓨터 파일에서 내보내기 → claude.ai에서 가져오기 =====
const readAsDataURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(b)});
document.getElementById("exportBtn").onclick=async()=>{
  const images={};
  for(const it of items)if(!it.type){const b=await idb("blobs","readonly",s=>s.get(it.id));if(b)images[it.id]=await readAsDataURL(b);}
  const out={v:1,colors:state,memo:memo.value,memoHtml:memoHTML(),memoFs:fsz,cam,items,images,cells,notes};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:"application/json"}));
  a.download="주택설계-옮기기.json";document.body.append(a);a.click();a.remove();
  note("‘주택설계-옮기기.json’ 파일을 받았어요. claude.ai 페이지의 보드에서 ‘가져오기’로 넣어 주세요.");};
function dataUrlToBlob(du){const [h,b64]=du.split(",");const type=(h.match(/data:([^;]+)/)||[])[1]||"image/png";
  const bin=atob(b64),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type});}
document.getElementById("importIn").addEventListener("change",async ev=>{
  const f=ev.target.files[0];ev.target.value="";if(!f||!cloud.db)return;
  let d;try{d=JSON.parse(await f.text());}catch(e){note("이 파일은 읽을 수 없어요. 컴퓨터에서 ‘내보내기’로 받은 파일을 골라 주세요.");return;}
  document.getElementById("importLbl").hidden=true;note("가져오는 중…");
  if(d.colors){state={...d.colors};Object.keys(els).forEach(paint);save();}
  if(Array.isArray(d.notes)){for(const n of d.notes)if(!notes.some(o=>o.id===n.id)){notes.push(n);saveNote(n);}drawNotes();}
  if(typeof d.memo==="string"){if(typeof d.memoHtml==="string")setMemoHTML(d.memoHtml);else memo.value=d.memo;if(d.memoFs)setFs(d.memoFs,true);saveMemo();}
  if(d.cam&&d.cam.z)putCam("",d.cam);
  if(d.cells){cells={...d.cells};drawCells();saveCells();}
  let n=0,fail=0;
  for(const src of d.items||[]){const it={...src};
    if(!it.type){const du=d.images&&d.images[it.id];if(!du){fail++;continue;}
      try{let blob=dataUrlToBlob(du);const url=URL.createObjectURL(blob);
        if(!/^image\/(png|jpeg|gif|webp)$/.test(blob.type))blob=await toPng(url);
        const r=await cloud.assets.upload(blob);it.asset=r.id;urls[it.id]=url;}catch(e){fail++;continue;}}
    items.push(it);topZ=Math.max(topZ,it.z||1);n++;renderAll();note(`가져오는 중… (${n}개)`);}
  renderAll();saveMeta();
  note(fail?`가져왔어요. 이미지 ${fail}개는 옮기지 못했어요.`:"모두 가져왔어요. 이제 모든 기기에서 같은 내용이 보여요.");
});
